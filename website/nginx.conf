server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # Declared once here so every location inherits them (no add_header below).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Hashed build files: cache for a year. A missing one is a real 404.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # nginx's mime.types has no entry for .webmanifest.
  location = /site.webmanifest {
    default_type application/manifest+json;
    expires 7d;
  }

  # Screenshots, icons, social card: a week.
  location ~* \.(?:webp|png|jpg|jpeg|svg|ico|webmanifest)$ {
    expires 7d;
    try_files $uri =404;
  }

  # The page itself is always revalidated, so deploys show up at once.
  location = /index.html {
    expires -1;
  }

  # SPA fallback.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
