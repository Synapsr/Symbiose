<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Symbiose · Mange en conscience, pas en comptant.</title>
    <meta
      name="description"
      content="Symbiose est un compagnon repas open source, piloté par l'IA. Dis ton objectif avec tes mots, photographie ton assiette : il calcule tout selon ce qui compte pour toi, sur ton propre serveur." />
    <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--preload-->
    <!--seo-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Symbiose" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:title" content="Symbiose · Mange en conscience, pas en comptant." />
    <meta
      property="og:description"
      content="Le compagnon repas open source, piloté par l'IA, que tu héberges toi-même. Dis ton objectif avec tes mots, photographie ton assiette." />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Symbiose : Mange en conscience, pas en comptant." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Symbiose · Mange en conscience, pas en comptant." />
    <meta name="twitter:description" content="Le compagnon repas open source, piloté par l'IA, que tu héberges toi-même." />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Symbiose",
        "description": "Open-source, AI-first meal tracker that adapts to your goals. Self-hosted.",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "iOS, Android",
        "license": "https://opensource.org/licenses/MIT",
        "sameAs": "https://github.com/Synapsr/Symbiose",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <script>
      // Before first paint: resolve the theme and the language, so nothing flashes.
      (function () {
        var d = document.documentElement;
        var theme, lang;
        d.classList.add('js');
        try {
          theme = localStorage.getItem('symbiose-theme');
          lang = localStorage.getItem('symbiose-lang');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        d.setAttribute('data-theme', theme);
        var query = new URLSearchParams(location.search).get('lang');
        if (query === 'en' || query === 'fr') lang = query;
        if (lang === 'en') {
          d.lang = 'en';
          d.classList.add('lang-swap');
          setTimeout(function () {
            d.classList.remove('lang-swap');
          }, 2500);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
