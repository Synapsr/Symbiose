name: Suggest an improvement
description: An idea to make Symbiose better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Symbiose aims to stay simple, so the most useful suggestions start from a problem rather than a solution. Before asking for a new screen or setting, ask whether a better default would do.
        Please search the [existing issues](https://github.com/Synapsr/Symbiose/issues) first.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in your way today.
      placeholder: When I eat out, logging the meal takes me …
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine Symbiose handling it. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: What you do today, or how other apps handle it.

  - type: dropdown
    id: where
    attributes:
      label: Where would it live?
      multiple: true
      options:
        - The app
        - Apple Watch, widgets or Live Activity
        - The coach and the AI
        - The server and self-hosting
        - The website or docs

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see [CONTRIBUTING.md](https://github.com/Synapsr/Symbiose/blob/main/CONTRIBUTING.md)).
