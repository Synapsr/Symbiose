# docker compose up -d   →   http://<your-ip>:3000
services:
  symbiose:
    image: ghcr.io/synapsr/symbiose:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # AI_MODEL: claude-opus-5-5
      # PUBLIC_URL: https://symbiose.example.com
      # ALLOW_SIGNUP: "true"
      # ADMIN_EMAILS: you@example.com
    volumes:
      - symbiose-data:/data

volumes:
  symbiose-data:
