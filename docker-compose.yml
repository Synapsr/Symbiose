# Symbiose server: docker compose up -d, then open http://<your-server>:3000
# Every variable is described in docs/self-hosting.md.
services:
  symbiose:
    # `latest` is the latest release. Each release is also published by version (`:0.1`, `:0.1.0`) if you'd rather pin one.
    image: synapsr/symbiose:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Another AI provider: openai, mistral, gemini, openrouter, ollama or openai-compatible
      # AI_PROVIDER: openai
      # AI_API_KEY: ${AI_API_KEY:-}
      # PUBLIC_URL: https://symbiose.example.com   # behind a reverse proxy
      # SIGNUP: request                            # or open; closed by default
      # ADMIN_EMAILS: you@example.com
    volumes:
      - symbiose-data:/data

volumes:
  symbiose-data:
